name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to create from the selected commit, e.g. v0.1.0"
        required: true
        type: string

env:
  # A tag push gives the version in the ref name; a manual run gives it as an input.
  VERSION: ${{ inputs.version || github.ref_name }}

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    name: Binaries and GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: Check version format
        run: |
          [[ "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::'${VERSION}' is not a vX.Y.Z tag"; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: false
      - name: Test
        run: go test ./... -count=1
      - name: Build
        run: |
          set -euo pipefail
          version="${VERSION}"
          mkdir -p dist
          for arch in amd64 arm64; do
            dir="asterisk-exporter-${version}.linux-${arch}"
            mkdir -p "dist/${dir}"
            CGO_ENABLED=0 GOOS=linux GOARCH="${arch}" go build -trimpath \
              -ldflags="-s -w -X main.version=${version}" -o "dist/${dir}/asterisk-exporter" ./cmd/asterisk-exporter
            cp LICENSE README.md "dist/${dir}/"
            cp -r deploy "dist/${dir}/deploy"
            tar -C dist -czf "dist/${dir}.tar.gz" "${dir}"
            rm -rf "dist/${dir}"
          done
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # --target is only used when the tag does not exist yet (manual run).
          gh release create "${VERSION}" dist/*.tar.gz dist/SHA256SUMS \
            --target "${GITHUB_SHA}" --title "${VERSION}" --generate-notes

  image:
    name: Container image (GHCR)
    runs-on: ubuntu-latest
    steps:
      - name: Check version format
        run: |
          [[ "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::'${VERSION}' is not a vX.Y.Z tag"; exit 1; }
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/erenozgu/asterisk-exporter
          tags: |
            type=raw,value=${{ env.VERSION }}
            type=raw,value=${{ startsWith(env.VERSION, 'v') && !contains(env.VERSION, '-') && 'latest' || 'prerelease' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: exporter
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ env.VERSION }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
