# Demo: a simulated Asterisk, the exporter, Prometheus (with the alert rules) and
# Grafana (with the dashboard), all wired up.
#
#   docker compose up -d --build
#   -> Grafana     http://localhost:3000   (opens straight on the Asterisk dashboard)
#   -> Prometheus  http://localhost:9090
#   -> Exporter    http://localhost:9650/metrics
#
# Everything is bound to 127.0.0.1. Grafana runs with anonymous admin access to keep
# the demo one command long: do not expose it as is.
name: asterisk-exporter-demo

services:
  amisim:
    build: { context: ., target: amisim }
    command: ["-listen", ":5038", "-user", "exporter", "-secret", "demo-secret"]

  exporter:
    build: { context: ., target: exporter }
    environment:
      ASTERISK_AMI_USERNAME: exporter
      ASTERISK_AMI_SECRET: demo-secret
    command: ["-ami.address", "amisim:5038", "-asterisk.timezone", "UTC"]
    depends_on: [amisim]
    ports: ["127.0.0.1:9650:9650"]

  prometheus:
    image: prom/prometheus:v2.55.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=2d"]
    volumes:
      - ./deploy/prometheus:/etc/prometheus:ro
    depends_on: [exporter]
    ports: ["127.0.0.1:9090:9090"]

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/asterisk.json
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]
    ports: ["127.0.0.1:3000:3000"]
