; /etc/asterisk/manager.conf — a read-only-in-spirit AMI user for the exporter.
; Only the actions the exporter sends are used, and the user can only reach AMI from localhost.
[general]
enabled = yes
bindaddr = 127.0.0.1
port = 5038

[exporter]
secret = change-me
deny = 0.0.0.0/0.0.0.0
permit = 127.0.0.1/255.255.255.255
; Actions are authorised by the *write* class. Verified on Asterisk 20.6:
;   system    -> PJSIPShowEndpoints, PJSIPShowContacts, CoreStatus, CoreSettings, CoreShowChannels, SIPpeers
;   reporting -> ConfbridgeListRooms, CoreStatus, CoreSettings, CoreShowChannels, SIPpeers
write = system,reporting
; The exporter logs in with "Events: off", so no read classes are needed.
read =
